[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klip"
version = "0.1.0"
description = "GTA 6 clipping pipeline: source -> highlight -> render -> publish -> payout ledger"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "anthropic>=0.60",
  "yt-dlp>=2025.1.1",
  "tenacity>=8.3",
]

[project.optional-dependencies]
captions = ["faster-whisper>=1.0"]
youtube = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2", "google-auth-httplib2>=0.2"]
dev = ["pytest>=8.2", "mypy>=1.10", "ruff>=0.5"]
all = ["klip[captions,youtube,dev]"]

[project.scripts]
clipengine = "clipengine.cli:app"
klip = "clipengine.cli:app"

[tool.setuptools.packages.find]
include = ["clipengine*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
